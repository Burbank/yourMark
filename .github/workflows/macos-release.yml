name: Mac app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.app || true
          xcodebuild -version
          swift --version
      - name: Package DMG
        run: |
          chmod +x Scripts/*.sh Scripts/*.command || true
          ./Scripts/package-dmg.sh
          ls -lh dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: yourMark-dmg
          path: dist/yourMark*.dmg
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          NOTES="$(cat <<'EOF'
Drag **yourMark** onto **Applications** (follow the arrow).

If macOS blocks it: click **Done** (not Move to Bin), then **Privacy & Security Settings** on the disk → **Open Anyway**.

First launch installs Microsoft MarkItDown from PyPI.
EOF
)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/yourMark-*.dmg dist/yourMark.dmg --clobber
          else
            gh release create "$TAG" dist/yourMark-*.dmg dist/yourMark.dmg \
              --title "yourMark $TAG" \
              --notes "$NOTES" \
              --latest
          fi
