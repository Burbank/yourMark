name: Mac app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.app || true
          xcodebuild -version
          swift --version
      - name: Package DMG
        run: |
          chmod +x Scripts/*.sh Scripts/*.command || true
          ./Scripts/package-dmg.sh
          ls -lh dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: yourMark-dmg
          path: |
            dist/yourMark-*.dmg
            dist/yourMark.dmg
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "Not a tag; skipping release upload"
            exit 0
          fi
          NOTES="$(cat docs/release-notes.md)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/yourMark-*.dmg dist/yourMark.dmg --clobber
          else
            gh release create "$TAG" dist/yourMark-*.dmg dist/yourMark.dmg --title "yourMark $TAG" --notes "$NOTES"
          fi
          gh release edit "$TAG" --latest
