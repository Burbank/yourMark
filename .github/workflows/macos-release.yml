name: Mac app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.app || true
          xcodebuild -version
          swift --version
      - name: Package DMG
        run: |
          chmod +x Scripts/*.sh Scripts/*.command || true
          ./Scripts/package-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: yourMark-dmg
          path: dist/yourMark.dmg
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/yourMark.dmg \
            --title "yourMark ${{ github.ref_name }}" \
            --notes "Drag yourMark into Applications. First launch: System Settings → Privacy & Security → Open Anyway if macOS asks. Converter: double-click Install Engine on the disk image, or \`uv tool install 'markitdown[all]'\`." \
            --fail-on-name-conflict || gh release upload "${{ github.ref_name }}" dist/yourMark.dmg --clobber
