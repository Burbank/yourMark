name: Windows exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "windows/**"
      - ".github/workflows/windows-exe.yml"

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools and MarkItDown
        run: |
          python -m pip install -U pip
          python -m pip install pyinstaller "markitdown[pdf]" python-docx python-pptx openpyxl
      - name: Build yourMark.exe
        working-directory: windows
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile `
            --name yourMark `
            --icon yourmark.ico `
            --add-data "markitdown_convert.py;." `
            --collect-all markitdown `
            --collect-all magika `
            --collect-all pdfminer `
            --hidden-import pdfminer `
            --hidden-import pdfminer.high_level `
            --hidden-import magika `
            yourmark.py
          dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: yourMark-windows
          path: windows/dist/yourMark.exe
      - name: Smoke convert with the exe
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys, time
          Path("hello.pdf").write_bytes(
              b"%PDF-1.4\n"
              b"1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n"
              b"2 0 obj<</Type/Pages/Count 1/Kids[3 0 R]>>endobj\n"
              b"3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 300 144]/Contents 4 0 R/Resources<</Font<</F1 5 0 R>>>>>>endobj\n"
              b"4 0 obj<</Length 44>>stream\n"
              b"BT /F1 18 Tf 40 70 Td (Windows smoke) Tj ET\n"
              b"endstream\nendobj\n"
              b"5 0 obj<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>endobj\n"
              b"xref\n0 6\n0000000000 65535 f \n0000000009 00000 n \n"
              b"0000000058 00000 n \n0000000115 00000 n \n0000000274 00000 n \n"
              b"0000000392 00000 n \ntrailer<</Size 6/Root 1 0 R>>\nstartxref\n466\n%%EOF\n"
          )
          exe = Path("windows/dist/yourMark.exe")
          r = subprocess.run([str(exe), "--cli", "hello.pdf"], timeout=120)
          md = Path("hello/hello.md")
          # Windowed onefile may return before the worker finishes.
          for _ in range(30):
              if md.exists() and md.stat().st_size > 0:
                  break
              time.sleep(1)
          if not md.exists():
              sys.exit(f"missing {md} (exe exit {r.returncode})")
          print(md.read_text(encoding="utf-8", errors="replace"))

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          EXE=windows/dist/yourMark.exe
          VER=$(grep -A1 CFBundleShortVersionString Scripts/build-app.sh | tail -n1 | sed -n 's/.*<string>\([^<]*\)<\/string>.*/\1/p')
          VER=${VER:-0.0.0}
          cp "$EXE" "windows/dist/yourMark-${VER}.exe"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi
          if [[ -z "$TAG" ]]; then
            echo "No release yet; artifact only"
            exit 0
          fi
          # Latest gets the simple name; every kept release also gets a versioned exe.
          gh release upload "$TAG" "$EXE" "windows/dist/yourMark-${VER}.exe" --clobber
          echo "Uploaded yourMark.exe and yourMark-${VER}.exe to $TAG"

