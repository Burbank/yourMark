name: CI

on:
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      
      - name: Show versions
        run: |
          swift --version
          xcodebuild -version
      
      - name: Install MarkItDown (optional, for full tests)
        continue-on-error: true
        run: |
          brew install uv
          uv tool install 'markitdown[pdf,docx,pptx,xlsx,xls,outlook,audio-transcription,youtube-transcription,az-doc-intel]'
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Build YourMark app (release)
        run: swift build -c release --product YourMark
      
      - name: Build yourmark CLI (release)
        run: swift build -c release --product yourmark
      
      - name: Build YourMark app with APPSTORE flag
        run: swift build -c release -Xswiftc -DAPPSTORE --product YourMark
      
      - name: Run tests
        run: swift test
      
      - name: Generate Xcode project
        run: python3 Scripts/generate-xcodeproj.py
      
      - name: Build with Xcode (Debug, no signing)
        run: |
          xcodebuild \
            -project YourMark.xcodeproj \
            -scheme yourMark \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
      
      - name: Check CLI help
        run: |
          .build/release/yourmark --help
          .build/release/yourmark convert --help
          .build/release/yourmark doctor --json
